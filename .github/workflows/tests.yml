name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/offline_smoke.py
      - run: docker build -t sixteen-memory:test .
  cloudflare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run types
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist
      - run: npm run test:runtime
      - run: npm run test:extended
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
