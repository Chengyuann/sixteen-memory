name: Bounded Network Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memory-network:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Operator transport unit tests
        run: node --test cloudflare/test/memory-transport.test.mjs
      - name: Baseline and frozen candidate health and auth boundaries
        env:
          NETWORK_REPORT: ${{ runner.temp }}/network-report.json
          INCLUDE_WORKERS_ORIGIN: "1"
        run: node cloudflare/scripts/network-check.mjs
      - name: Save sanitized diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-network-report
          path: ${{ runner.temp }}/network-report.json
          if-no-files-found: warn
          retention-days: 7
