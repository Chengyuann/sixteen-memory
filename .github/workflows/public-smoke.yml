name: Public Endpoint Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check health and unauthenticated boundaries
        env:
          PUBLIC_BASE_URL: https://sixteen-memory-v023-entry.pages.dev
        run: node cloudflare/scripts/public-smoke.mjs
